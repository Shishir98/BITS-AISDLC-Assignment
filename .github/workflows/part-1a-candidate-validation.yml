name: Part-1A protected candidate validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to validate (no branch names or tags)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve and validate trusted and candidate refs
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VAL: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_VAL" != "refs/heads/main" ]]; then
              echo "Dispatch this workflow from protected main." >&2
              exit 1
            fi
            TRUSTED_SHA="$WORKFLOW_SHA"
            CANDIDATE_SHA="$INPUT_CANDIDATE_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_BASE_REF" != "main" ]]; then
              echo "Pull request target branch must be protected main." >&2
              exit 1
            fi
            TRUSTED_SHA="$PR_BASE_SHA"
            CANDIDATE_SHA="$PR_HEAD_SHA"
          else
            echo "Unsupported workflow event: $EVENT_NAME" >&2
            exit 1
          fi
          if [[ ! "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "trusted_sha must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          printf 'trusted_sha=%s\ncandidate_sha=%s\n' "$TRUSTED_SHA" "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Initialize run-specific evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_SHA: ${{ steps.refs.outputs.trusted_sha }}
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/part-1a-evidence"
          printf 'event_name=%s\nrun_id=%s\nrun_attempt=%s\nworkflow_ref=%s\ntrusted_sha=%s\ncandidate_sha=%s\n' \
            "$EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKFLOW_REF" "$TRUSTED_SHA" "$CANDIDATE_SHA" \
            > "$RUNNER_TEMP/part-1a-evidence/dispatch.txt"

      - name: Checkout trusted main workflow and controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.refs.outputs.trusted_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Checkout candidate commit separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.refs.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Prepare verified run-specific staging
        id: prepare
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate_sha }}
        run: |
          python trusted/Part-1A/.harness/trust/prepare_candidate.py \
            --trusted-root trusted/Part-1A \
            --trusted-repo-root trusted \
            --candidate-root candidate/Part-1A \
            --candidate-sha "$CANDIDATE_SHA" \
            --stage "$RUNNER_TEMP/part-1a-stage/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --evidence "$RUNNER_TEMP/part-1a-evidence" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run locked tests, Ruff, Bandit, and repository hygiene
        id: validation
        if: steps.prepare.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python trusted/Part-1A/.harness/trust/run_validation.py \
            --source candidate/Part-1A \
            --stage "$RUNNER_TEMP/part-1a-stage/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --evidence "$RUNNER_TEMP/part-1a-evidence" \
            --environment "$RUNNER_TEMP/part-1a-venv/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uv-cache "$RUNNER_TEMP/part-1a-uv-cache/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Seal and verify evidence bundle
        id: evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate_sha }}
        run: |
          python trusted/Part-1A/.harness/trust/seal_evidence.py \
            --evidence "$RUNNER_TEMP/part-1a-evidence" \
            --manifest "$RUNNER_TEMP/part-1a-evidence-manifest.json" \
            --candidate-root candidate/Part-1A \
            --candidate-sha "$CANDIDATE_SHA"

      - name: Retain logs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: part-1a-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/part-1a-evidence/
            ${{ runner.temp }}/part-1a-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail unless validation and integrity checks passed
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          PREPARE_READY: ${{ steps.prepare.outputs.ready }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          if [[ "$PREPARE_OUTCOME" != "success" || "$PREPARE_READY" != "true" ]]; then
            echo "Trusted bootstrap, human approval, or candidate integrity check failed." >&2
            exit 1
          fi
          if [[ "$VALIDATION_OUTCOME" != "success" ]]; then
            echo "Candidate tests or quality checks failed." >&2
            exit 1
          fi
          if [[ "$EVIDENCE_OUTCOME" != "success" ]]; then
            echo "Evidence bundle integrity verification failed." >&2
            exit 1
          fi
