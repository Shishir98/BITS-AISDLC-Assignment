[project]
name = "reminder-agent"
version = "0.1.0"
description = "Stateless natural-language reminder intent interpretation using local Ollama inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
    "pydantic==2.11.3",
    "pyyaml==6.0.2",
    "tzdata==2025.2",
    "uvicorn==0.34.0",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
