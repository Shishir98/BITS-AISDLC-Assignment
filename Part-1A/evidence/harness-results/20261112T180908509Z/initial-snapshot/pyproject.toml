[project]
name = "smart-todo-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.4",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
